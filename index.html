<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dinesh Kumar M - 3D Character Artist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="header/images/logo.svg" alt="Dinesh Logo" style="height: 40px; width: auto;">
            <span>DINESH KUMAR M</span>
        </div>
        <nav>
            <a href="#about">ABOUT ME</a>
            <a href="#projects">PROJECTS</a>
            <a href="#skills">SKILLS</a>
            <a href="#contact">CONTACT ME</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-video-container">
                <!-- User to replace 'hero-section/main-hero/videos/hero-background.mp4' with actual video -->
                <video autoplay muted loop playsinline class="hero-video">
                    <source src="hero-section/main-hero/videos/hero-background.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div class="video-overlay-gradient"></div>
            </div>
            <div class="hero-overlay">
                <h1 id="hero-headline">
                    <span class="static-text">3D GENERALIST</span>
                    <span class="loop-text" id="hero-loop"></span>
                </h1>
                <p id="hero-description" class="shine-text"><!-- Dynamic --></p>
            </div>
        </section>

        <section class="showcase">
            <div class="marquee-container">
                <div class="marquee-content">
                    <!-- Duplicate items for seamless loop -->
                    <div class="showcase-item"><img src="work/animation/combat-sequence/images/showcase.png"
                            alt="Showcase 1"></div>
                    <div class="showcase-item"><img src="work/3d-character/warrior-cyborg/images/hero.png"
                            alt="Showcase 2"></div>
                    <div class="showcase-item"><img src="work/animation/facial-acting/images/showcase.png"
                            alt="Showcase 3"></div>
                    <div class="showcase-item"><img src="work/3d-character/future-soldier/images/hero.png"
                            alt="Showcase 4"></div>

                    <!-- Duplicated set -->
                    <div class="showcase-item"><img src="work/animation/combat-sequence/images/showcase.png"
                            alt="Showcase 1"></div>
                    <div class="showcase-item"><img src="work/3d-character/warrior-cyborg/images/hero.png"
                            alt="Showcase 2"></div>
                    <div class="showcase-item"><img src="work/animation/facial-acting/images/showcase.png"
                            alt="Showcase 3"></div>
                    <div class="showcase-item"><img src="work/3d-character/future-soldier/images/hero.png"
                            alt="Showcase 4"></div>
                </div>
            </div>
        </section>

        <section class="about-me" id="about">
            <div class="about-content">
                <h2>ABOUT ME</h2>
                <div class="divider"></div>
                <h3 id="profile-name"></h3>
                <p id="profile-bio"></p>
            </div>
            <div class="about-image">
                <div class="image-wrapper">
                    <img src="profile/profile-picture/profile.png" alt="Dinesh Kumar M">
                </div>
            </div>
        </section>

        <section class="projects" id="projects">
            <div class="projects-nav">
                <button class="active" data-category="all">ALL</button>
                <button data-category="3d-character">3D CHARACTER</button>
                <button data-category="animation">ANIMATION</button>
                <button data-category="digital-sculpture">DIGITAL SCULPTURE</button>
                <button data-category="visualisation">VISUALISATION</button>
            </div>
            <div class="projects-grid">
                <!-- Content populated by script.js -->
            </div>
        </section>

        <section class="skills" id="skills">
            <div class="container">
                <h2>SKILLS</h2>
                <div class="divider"></div>
                <div class="skills-list" id="skills-list">
                    <!-- Skills populated by JS -->
                </div>
            </div>
        </section>

        <section class="software-ticker">
            <h3>SOFTWARES KNOWN</h3>
            <div class="software-marquee-container">
                <div class="software-marquee-content" id="software-ticker">
                    <!-- Icons populated by JS -->
                </div>
            </div>
        </section>

        <section class="contact-footer" id="contact">
            <p class="cta-text">"INTERESTED IN WORKING TOGETHER?"</p>
            <a href="mailto:dneshmk@gmail.com" class="contact-btn">CONTACT ME</a>
            <div class="contact-info">
                <p>+91 8073332016</p>
                <p>dneshmk@gmail.com</p>
            </div>
            <footer>
                &copy; 2026 Dinesh Kumar M. All Rights Reserved.
            </footer>
        </section>
    </main>

    <script src="cms_data.js"></script>
    <script src="script.js"></script>
</body>

</html>
